<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to MicProbe...</title>
  <link rel="canonical" href="https://micprobe.com/app">
  <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" sizes="any">
  <!-- Redirect to main app -->
  <meta http-equiv="refresh" content="0;url=/app">
  <script>
    // Immediate redirect (faster than meta refresh)
    window.location.replace('/app' + window.location.search);
  </script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    /* Yalnizca yerlesim; renk/font token'lardan (variables.css) gelir */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }
    .redirect-msg {
      text-align: center;
      color: var(--text-secondary);
    }
    .redirect-msg a {
      color: var(--color-purple-light);
    }
  </style>
</head>
<body>
  <div class="redirect-msg">
    <p>Redirecting to MicProbe...</p>
    <p><a href="/app">Click here if not redirected</a></p>
  </div>
</body>
</html>
